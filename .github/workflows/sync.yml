name: 매일 YouTube 동기화

on:
  schedule:
    # 매일 오전 6시 30분 KST (= UTC 21:30 전날)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: YouTube 동기화 (새벽기도 · 주일설교 · 교리문답 · 금요기도회)
        run: node scripts/scraper/youtube-sync.mjs

      - name: 변경 사항 확인 및 커밋
        run: |
          git config user.name "gwanak-sync-bot"
          git config user.email "gwanak-sync-bot@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "새로운 콘텐츠 없음 — 커밋 건너뜀"
          else
            ADDED=$(git diff --staged --stat | tail -1)
            git commit -m "자동 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d') YouTube 동기화 ($ADDED)"
            git push
          fi
