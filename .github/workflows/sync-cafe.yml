name: 매일 다음카페 동기화

on:
  schedule:
    # 매주 월요일 오전 9시 KST (= UTC 00:00 월) — 주일 주보 조기 반영
    - cron: '0 0 * * 1'
    # 매일 오후 9시 KST (= UTC 12:00) — 일반 카페 콘텐츠 당일 반영
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-cafe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: YouTube 동기화
        run: node scripts/scraper/youtube-sync.mjs

      - name: 다음카페 동기화 — 주보 (IYIi)
        run: node scripts/scraper/scrape.mjs IYIi
        continue-on-error: true

      - name: 다음카페 동기화 — 교회소식 (IAd7 · GZ99)
        run: node scripts/scraper/scrape.mjs IAd7 GZ99
        continue-on-error: true

      - name: 다음카페 동기화 — 하이델베르크 요리문답 (I5uP)
        run: node scripts/scraper/scrape.mjs I5uP
        continue-on-error: true

      - name: 다음카페 동기화 — 시편찬송 (ROHB)
        run: node scripts/scraper/scrape.mjs ROHB
        continue-on-error: true

      - name: 다음카페 동기화 — 주일설교 본문 (RMqC)
        run: node scripts/scraper/scrape.mjs RMqC
        continue-on-error: true

      - name: 다음카페 동기화 — 매일말씀묵상 요한복음·사무엘상 (RXZr · RXfF)
        run: node scripts/scraper/scrape.mjs RXZr RXfF
        continue-on-error: true

      - name: 변경 사항 확인 및 커밋
        id: commit
        run: |
          git config user.name "gwanak-sync-bot"
          git config user.email "gwanak-sync-bot@users.noreply.github.com"
          git add public/data/ scripts/scraper/progress.json
          if git diff --staged --quiet; then
            echo "새로운 콘텐츠 없음 — 커밋 건너뜀"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            ADDED=$(git diff --staged --stat | tail -1)
            git commit -m "자동 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d') 카페+YouTube 동기화 ($ADDED)"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Vercel 프로덕션 배포
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_cSdDirXmoHpWPIVpdMjU70go
          VERCEL_PROJECT_ID: prj_zd9bDRw56hnRjW8TElnuHUMvJHXX
